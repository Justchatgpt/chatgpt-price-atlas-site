name: Publish Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      update_scope:
        description: "rates: 更新汇率；all: 同时更新 Apple 原价；deploy-only: 仅发布"
        required: true
        default: rates
        type: choice
        options: [rates, all, deploy-only]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Update public price snapshots
        if: github.event_name == 'workflow_dispatch' && inputs.update_scope != 'deploy-only'
        env:
          UPDATE_SCOPE: ${{ inputs.update_scope }}
        run: python3 scripts/pages_update.py --data-dir data --scope "$UPDATE_SCOPE"
      - name: Save updated snapshots
        if: github.event_name == 'workflow_dispatch' && inputs.update_scope != 'deploy-only'
        run: |
          if ! git diff --quiet -- data; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add data/prices.json data/exchange-rates.json
            git commit -m 'chore: update public price snapshots'
            git push origin HEAD:main
          fi
      - name: Prepare public-only site files
        run: python3 scripts/pages_update.py --prepare-site
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
