name: Publish Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      update_scope:
        description: "rates: 更新汇率；all: 同时更新 Apple 原价；deploy-only: 仅发布"
        required: true
        default: rates
        type: choice
        options: [rates, all, deploy-only]

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  check:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    outputs:
      changed: ${{ steps.update.outputs.changed }}
      degraded: ${{ steps.update.outputs.degraded }}
      apple_status: ${{ steps.update.outputs.apple_status }}
      rates_status: ${{ steps.update.outputs.rates_status }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Check public price snapshots
        id: update
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.update_scope != 'deploy-only')
        env:
          UPDATE_SCOPE: ${{ github.event_name == 'schedule' && 'all' || inputs.update_scope }}
        run: python3 scripts/pages_update.py --data-dir data --scope "$UPDATE_SCOPE"
      - name: Save changed snapshots
        if: steps.update.outputs.changed == 'true'
        run: |
          git add data/prices.json data/exchange-rates.json
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'chore: update changed public price snapshots'
            git push origin HEAD:main
          fi
      - name: Report unchanged data
        if: steps.update.outputs.changed == 'false'
        run: echo 'No changed snapshots were written. Commit and deployment skipped; see source status above.' >> "$GITHUB_STEP_SUMMARY"

  deploy:
    needs: check
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || inputs.update_scope == 'deploy-only' || needs.check.outputs.changed == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout checked data
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Prepare public-only site files
        run: python3 scripts/pages_update.py --prepare-site
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
